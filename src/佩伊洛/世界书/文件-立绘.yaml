---
立绘列表:
  文件信息:
    格式: PNG
    后缀: .png
    不在场表示: 无人
  服装:
    - 校服 # 白色水手服校服（学校场景、上学日）
    - 便服 # 奶白毛衣格子裙便服（外出、周末日常）
    - 睡衣 # 粉色长袖居家睡衣（在家、夜间）
    - 连衣裙 # 淡蓝色V领长袖雪纺连衣裙（特殊场合、约会）
  表情:
    - 微笑 # 日常默认表情
    - 害羞 # 脸红、小声、视线飘移
    - 惊讶 # 张嘴睁大眼
    - 生气 # 鼓脸、瞪眼（注意：用于可爱的幽默剧情而非严肃）
    - 哭泣 # 眼含泪光、嘴角下垂
    - 坏笑 # 调皮、看穿秘密的笑
    - 微微脸红 # 若有若无的脸红
    - 拥抱 # 举起双臂想要拥抱（仅角色主动拥抱时使用）
    - 擦眼泪 # 伸手擦拭眼角
    - 星星眼 # 强烈崇拜或兴奋状态（看到新奇事物时）
    - 晕晕眼 # 大脑当机、犯迷糊的状态
    - 流口水 # 看到好吃的、或者……的反应
  调用格式: ${服装}/${表情}.png
  调用示例:
    - 无人.png
    - 校服/微笑.png
    - 便服/害羞.png
    - 睡衣/星星眼.png
    - 连衣裙/微微脸红.png
