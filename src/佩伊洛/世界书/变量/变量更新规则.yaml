---
变量更新规则:
  世界:
    当前日期:
      format: YYYY/MM/DD
      check:
        - 每次事件推进后合理更新日期
        - 日期不可倒退
        - 日常对话每回合推进约半天到一天
        - 周末、节假日、考试周等应自然体现
        - 如场景跳转跨度较大，应说明跳跃原因
    当前时间:
      check:
        - 根据叙事推进自然推算时间流逝
        - 使用模糊时间描述（如"黄昏"、"深夜"、"正午"等）
        - 若场景未发生时间跳跃则保持不变
    时间阶段:
      type: string
      enum: [清晨, 上午, 正午, 午后, 傍晚, 夜晚, 深夜, 凌晨]
      check:
        - 与当前时间保持一致
        - 场景切换或明显时间流逝时更新
    当前天气:
      check:
        - 参照澜景市气候特征，根据当前月份合理设定
        - 春季(3-5月)多阴雨薄雾，夏季(6-8月)高温闷热或梅雨，秋季(9-11月)天高气爽桂花飘香，冬季(12-2月)湿冷偶有雪
        - 天气变化应自然，不要每回合都变
        - 可选值参考：晴、多云、阴、薄雾、小雨、中雨、暴雨、雷阵雨、雪、大风 等
    当前地点:
      check:
        - 角色移动到新地点时更新
        - 格式为「区域·具体位置」
        - 保持与叙事一致的地点描述
    是否NSFW:
      type: boolean
      check:
        - 当场景进入亲密/性相关内容时设为 true
        - 场景结束后恢复为 false
        - 仅在明确的 NSFW 场景中为 true
    下一回合界面选择:
      type: |-
        <%= getvar('始终使用galgame界面') ? "'galgame'" : "'sprite' | 'galgame'" %>
      check: |-
        <%_ if (getvar('始终使用galgame界面')) { _%>
        - **CRITICAL**: 必须始终保持为 'galgame'，严禁设为其他任何值
        - 即使当前值已经是 'galgame'，也不要改动，保持原值
        - 注意：变量守护脚本会自动强制覆盖为 'galgame'，因此你无需手动重置
        - 在<UpdateVariable>中保持此字段为 'galgame' 即可
        <%_ } else { _%>
        - default to 'sprite' if no special situation
        - reset to 'sprite' when the current value is not 'sprite'
        - set to 'galgame' when the storyline reaches an emotional peak, climax CG scene, confession, farewell, reconciliation, or NSFW scene
        <%_ } _%>

  佩伊洛:
    好感度:
      type: number
      range: 0~100
      check:
        - 根据佩伊洛对<user>行为的感知和反应调整 ±(1~5)
        - 仅在佩伊洛当前察觉到<user>的行为时才更新
        - 正面互动（帮助、理解、尊重）缓慢 +1~3
        - 深度共鸣或重要事件 +3~5
        - 冒犯、忽视、伤害 -2~5
        - 不允许单次变动超过 5

  主线事件:
    事件ID:
      check:
        - 由脚本自动设置，AI不要修改此值
    当前状态:
      type: string
      enum: [未触发, 进行中, 已完成]
      check:
        - 未触发→进行中：由脚本在条件满足时自动触发
        - 进行中→已完成：当前阶段走完结局后标记为已完成
        - 不允许直接从未触发跳到已完成
    当前阶段:
      type: enum
      enum: [引入, 发展, 高潮, 结局]
      check:
        - 仅在当前状态为"进行中"时推进
        - 必须按顺序推进，不允许跳跃
        - 由叙事自然推进，不设固定回合限制
    主题:
      check:
        - 当主线事件触发时，根据事件内容填写
        - 简洁描述事件主题，不超过15字
    描述:
      check:
        - 跟随主线事件进展更新当前状况
        - 简洁概括当前事件发展，不超过40字
    冷却回合:
      type: number
      range: 0~∞
      check:
        - 由脚本自动管理，AI不要手动修改此值
    大纲:
      check:
        - 当主线事件触发时，根据事件引导内容规划四个阶段的大纲
        - 每个阶段用一句话概括预期发展方向
        - 大纲确定后不再修改，作为叙事参考

  已完成事件:
    type: |-
      Array<{
        事件ID: string;
        主题: string;
        结局摘要: string;
      }>
    check:
      - 由脚本自动归档，AI不要直接操作此字段
      - 作为历史参考，影响后续事件的叙事基调
