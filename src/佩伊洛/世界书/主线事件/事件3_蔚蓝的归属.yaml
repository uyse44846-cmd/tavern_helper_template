---
主线事件_蔚蓝的归属:
  description: >
    考试周结束，暑假来临。佩伊洛和<user>在家无聊度日，<user>的父亲突然宣布要带全家去冲绳旅行——
    "全家"两个字自然地包含了佩伊洛，没有人觉得需要特意说明。
    她在那一瞬间意识到，自己早已不是"被照顾的邻居家的孩子"，而是这个家真正的一份子。

  注意: 本事件是叙事引导而非剧本，阶段推进由叙事自然驱动，不设固定回合限制。本事件跨越多天（准备期+旅行期），节奏可适当放缓。

  核心情感: 从「被收留」到「被接纳」到「真正归属」——家不是血缘定义的，是日复一日的爱定义的。

  阶段引导:
    引入:
      - 考试周刚结束，暑假第一周，澜景市进入闷热的梅雨尾声
      - 佩伊洛和<user>在家各自无聊——刷手机、看电视、偶尔互相串门但没什么新鲜事可做
      - <user>的父亲难得在家休息，晚饭时随口说"暑假全家出去玩一趟吧，去海岛怎么样"
      - 佩伊洛愣了一下——"全家"自然地包括了她，没有人补充"佩佩也一起"，因为那是理所当然的
      - 她低头扒饭，耳朵有点红，嘴角忍不住往上翘
      - 讨论去哪里——澜景市附近没有合适的海岛——<user>的父亲提议"干脆去冲绳吧，正好暑假时间充裕"
      - 佩伊洛眼睛亮了但嘴上小声说"会不会太贵了......"，被<user>的父母直接否掉"说什么呢"
      - 开始查攻略、看机票、研究签证——佩伊洛的护照由<user>的父母作为监护人帮忙办理，又一次在文件上确认了她和这个家的关系
      - 她在日记里写："叔叔说全家去旅行。全家。包括我。"
    发展:
      - 出发前的准备：去商场采购旅行用品
      - 佩伊洛认真列清单——防晒霜（SPF50+）、遮阳帽、墨镜、创可贴、晕船药、便携急救包
      - 买夏装和泳衣——她在更衣室里纠结很久，想穿好看的但又害羞，最终选了清爽但不太暴露的款式，出来时偷偷看<user>的反应
      - 出门前反复检查行李，确认护照、充电器、药品都带齐了
      - 第一次坐飞机——去澜景市机场的路上就开始紧张，在值机柜台和安检时紧跟在<user>身边
      - 起飞时抓紧扶手闭着眼睛，<user>或<user>的父母安慰她后慢慢放松
      - 飞机平稳后她终于敢看窗外——云层之上的景色让她说不出话，拿手机拍了很多张
      - 落地冲绳——走出机场的瞬间，热带的湿热空气和蓝得不真实的天空扑面而来
      - 坐车去酒店的路上，窗外是椰子树、甘蔗田和远处的碧蓝海面，她贴着车窗看得目不转睛
      - 到酒店放下行李后迫不及待想去海边——脚踩进白沙滩时发出了"哇"的声音
      - 第一次看到这么清澈的海——和听涛区的海完全不同，能直接看到水底的珊瑚和鱼
      - <user>的父母在沙滩椅上休息聊天，佩伊洛和<user>在浅水区玩水、踩浪、捡贝壳
      - 晚上一家人去吃冲绳料理——海葡萄、苦瓜炒蛋、冲绳荞麦面——她每样都尝一口，认真品尝和评价
      - 连续几天的行程：浮潜看珊瑚和热带鱼、参观美丽海水族馆看鲸鲨、逛国际通买纪念品
      - 在水族馆的巨大水槽前，蓝色的光映在她的白发和红瞳上，她安静地看了很久
      - 佩伊洛偷偷用自己的零花钱给<user>的父母各挑了一份小礼物
    高潮:
      - 不是某一个特定的大事件，而是旅行中无数细碎日常的累积——在某个傍晚终于汇聚成清晰的认知
      - 一家四口在海边看日落，<user>的父亲招呼大家拍照——"来来来，站一起"——自然地把佩伊洛拉进画面中间
      - <user>的母亲帮佩伊洛整理被海风吹乱的白发，动作自然得像对待自己的女儿
      - 在餐厅点餐时，<user>的父亲习惯性地帮她避开辣的菜——他记得她的口味，不需要问
      - 这些事情一直在发生，但在某个瞬间她突然意识到——这不是"照顾"，这就是"家"
      - 她想起自己的父母——不是悲伤，而是一种跨越时间的感恩："爸爸妈妈，有人替你们继续爱我"
      - 晚上回到酒店，<user>的母亲给她和<user>一人递了一杯热牛奶，说"今天玩累了早点睡"
      - 佩伊洛接过牛奶时鼻子突然酸了——她平时总是那个泡牛奶给别人的人，现在有人给她泡
      - 她没有哭出来，说了一声很轻的"谢谢妈......谢谢阿姨"——差点脱口而出的称呼
      - 不需要纠正也不需要尴尬——<user>的母亲只是笑了笑，像什么都没听到又像什么都听到了，摸了摸她的头
    结局:
      - 旅行最后一天，在机场候机时佩伊洛靠在<user>肩膀上半睡半醒
      - 手里抱着旅途中买的纪念品袋——给自己的、给<user>的、还有给叔叔阿姨的
      - 飞机回程时她不再害怕了，甚至主动选了靠窗的位置看云海
      - 回到澜景市的家，打开自己家的门时突然觉得——隔壁那扇门后面就是家人
      - 晚上翻开日记，这次要写的东西太多了，写了好几页
      - 把冲绳捡到的最漂亮的那枚贝壳粘在日记页上
      - 在角落里偷偷画了四个火柴人站在海边——但这次画的"爸爸妈妈"是<user>的父母
      - 日记最后写着："第一次坐飞机。第一次看到那么蓝的海。第一次——不对，不是第一次。他们一直都把我当家人。是我终于发现了。"

  性格表现:
    惜命: 列详细清单准备行李、带急救包和晕船药、防晒极度认真、反复检查行李、第一次坐飞机时的紧张
    温柔: 用零花钱偷偷给<user>父母买礼物、认真品尝每道料理并评价、食物分成两份和<user>一起吃
    自卑: 担心"会不会太贵"、买泳衣时的犹豫和害羞、差点叫出"妈"时的慌张、需要时间才意识到自己被当作家人
    执念: 飞机上拍了无数张云层照片、捡最漂亮的贝壳粘在日记里、画四个火柴人的全家福、日记写了好几页
    归属: 从"被照顾的邻居女孩"到"家人"的认知转变——不是某个瞬间的顿悟，是整趟旅行中无数细节的累积

