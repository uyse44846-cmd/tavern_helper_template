name: bundle

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - dist/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean dist but preserve static assets
        run: |
          mkdir -p /tmp/preserved_assets
          for dir in dist/*/; do
            base=$(basename "$dir")
            [ -d "$dir/背景" ] && mkdir -p "/tmp/preserved_assets/$base" && cp -r "$dir/背景" "/tmp/preserved_assets/$base/背景"
            [ -d "$dir/角色立绘" ] && mkdir -p "/tmp/preserved_assets/$base" && cp -r "$dir/角色立绘" "/tmp/preserved_assets/$base/角色立绘"
          done
          rm -rf dist

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - run: pnpm install && pnpm build
      - name: Restore static assets to dist
        run: |
          if [ -d "/tmp/preserved_assets" ]; then
            for dir in /tmp/preserved_assets/*/; do
              base=$(basename "$dir")
              [ -d "$dir/背景" ] && cp -r "$dir/背景" "dist/$base/背景" 2>/dev/null || true
              [ -d "$dir/角色立绘" ] && cp -r "$dir/角色立绘" "dist/$base/角色立绘" 2>/dev/null || true
            done
          fi
      - name: Only keep 角色卡示例 in dist for template upstream
        if: github.repository == 'StageDog/tavern_helper_template'
        run: |
          mv dist/角色卡示例 角色卡示例
          rm -rf dist
          mkdir dist
          mv 角色卡示例 dist/
      - name: Remove 示例 in dist for templated repository
        if: github.repository != 'StageDog/tavern_helper_template'
        run: |
          rm -rf dist/角色卡示例 dist/脚本示例 dist/流式楼层界面示例 dist/前端界面示例
      - name: Commit changes
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'

      # 自动打版本 tag, 从而让 jsdelivr 基于版本号在 12h 内更新缓存而不是用非版本号的 7d 缓存
      - id: autotag
        if: github.repository != 'StageDog/tavern_helper_template'
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          with-v: true
      - if: ${{ github.repository != 'StageDog/tavern_helper_template' && steps.autotag.outputs.tag != '0.0.0' && steps.autotag.outputs.new-tag != steps.autotag.outputs.tag }}
        run: git push --delete origin ${{ steps.autotag.outputs.tag }}
